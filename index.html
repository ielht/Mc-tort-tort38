<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мс-торт-торт38</title>
    <style>
        @font-face {
            font-family: 'bdplakatt';
            src: url('bdplakatt.woff2');
        }
        @font-face {
            font-family: 'MetalReg2';
            src: url('Metal Reg-2.woff2');
        }

        body {
            background-color: #000000; 
            font-family: 'MetalReg2', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Главный заголовок */
        .main-title {
			text-align: center; 
			font-size: clamp(32px, 6vw, 100px); 
			color: white; 
			text-shadow: 1px 2px 0px #000000; 
			letter-spacing: 4px; 
    
			/* НАСТРОЙКА ОТСТУПОВ: */
			/* 20px сверху, 10px по бокам, 40px снизу (отодвигаем белый контейнер подальше) */
			margin: 20px 10px 100px 10px; 
    
			transform: scaleY(1.5);
			transform-origin: top; /* Шрифт вытягивается сверху вниз, убирая наезды */
		}

        /* Белый блок-контейнер */
        .container {
            margin: 40px auto;
            width: 90%;
            max-width: 1450px; 
            background-color: white;
            padding: 35px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column; /* Элементы идут строго друг за другом сверху вниз */
            align-items: center;
        }

        /* Верхняя панель с текстом приветствия и мишкой */
        .header-block {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .welcome-text {
            width: 100%;
            max-width: 550px; 
            text-align: left; 
            font-size: clamp(16px, 2vw, 20px); /* Уменьшается на мобилках */
            color: black; 
            font-weight: bold; 
            transform: scaleY(1.8); 
            text-shadow: 1px 0.5px 0px #ffffff;
            line-height: 1.4;
            margin: 10px 0;
        }

        .logo-bear {
            width: clamp(60px, 10vw, 100px); /* Мишка сжимается на смартфонах */
            height: clamp(60px, 10vw, 100px); 
            flex-shrink: 0;
        }

        /* Кнопка ДРУГАНЫ */
        .Drugani-text {
            width: 100%;
            max-width: 250px; 
            text-align: center;
            font-size: clamp(32px, 4vw, 44px); 
            color: black; 
            font-weight: bold; 
            margin: 40px auto;
            transform: scaleY(2); 
            text-shadow: 1px 0.5px 0px #ffffff;
            line-height: 1;
            text-decoration: none; 
            transition: text-shadow 0.2s ease; 
            display: block;
        }

        .Drugani-text:hover {
            color: black; 
            text-shadow: 2px 2px 0px #f200ff; 
        }

        /* Главная картинка с птицей */
        .main-img {
            display: block; 
            max-width: 670px; 
            width: 100%;
            height: auto; 
            margin: 20px auto 50px auto;
        }

        /* Блок комментариев */
        .comments-wrap {
            width: 100%;
            max-width: 800px;
            padding: 20px 0 0 0;
            border-top: 3px solid #000000; 
            box-sizing: border-box;
            margin-top: 20px;
        }

        /* Фиксы чисто для мобильных экранов */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 20px auto;
            }
            .header-block {
                flex-direction: column-reverse; /* На мобилке мишка встанет НАД текстом */
                align-items: center;
                text-align: center;
                gap: 15px;
            }
            .welcome-text {
                text-align: center;
                transform: scaleY(1.4); /* Чуть снизили вытягивание, чтобы не слипались строки */
            }
        }
    </style>
</head>
<body>

    <h3 class="main-title">Порно.com коммерческие товары оптом</h3>
	
    <div class="container">
        
        <!-- Блок приветствия -->
        <div class="header-block">
            <p class="welcome-text">
                Всем привет, это мой сайт, тут я буду писать о всём чем вздумаю, но самым главным контентом будут обзоры на музяку и всякие новости из жизни (они вам пиздец необходимы).
            </p>
            <img class="logo-bear" src="https://upload.wikimedia.org/wikipedia/en/thumb/6/65/RHbear.svg/250px-RHbear.svg.png" alt="Radiohead Bear">
        </div>
		
        <!-- Ссылка на кентавров -->
        <a href="friends.html" class="Drugani-text">ДРУГАНЫ</a>
		
		<!-- Картинка со злой синей птицей -->
        <img class="main-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqqbveuC8qCt1kMwh_yWf7DQbx3UfU6g-v85msohrNv-BMkyZDXsrywose&s=10" alt="Blue Bird">
	
        <!-- ИСПРАВЛЕННЫЙ ОФИЦИАЛЬНЫЙ ВИДЖЕТ ЧАТА -->
        <div class="comments-wrap" style="width: 100%; max-width: 800px; padding: 20px 0 0 0; border-top: 3px solid #000000; box-sizing: border-box; margin-top: 20px;">
            
            <!-- Официальный контейнер виджета -->
            <div id="tlkio" data-channel="mc-tort-tort38" style="height:500px; width:100%;"></div>
            
            <!-- Подключение оригинального скрипта, который открывает отправку -->
            <script async src="https://tlkio.com" type="text/javascript"></script>
            
        </div>
	
    </div> <!-- Конец белого контейнера -->

</body>
</html>
