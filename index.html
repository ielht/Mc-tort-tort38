<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мс-торт-торт38</title>
    <style>
        @font-face {
            font-family: 'bdplakatt';
            src: url('bdplakatt.woff2');
        }
        @font-face {
            font-family: 'MetalReg2';
            src: url('Metal Reg-2.woff2');
        }

        body {
            background-color: #000000; 
            font-family: 'MetalReg2', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Главный заголовок */
        .main-title {
            text-align: center; 
            font-size: clamp(40px, 6vw, 100px); /* Адаптивный размер шрифта */
            color: white; 
            text-shadow: 1px 2px 0px #000000; 
            letter-spacing: 4px; 
            margin: 20px 0;
        }

        /* Белый блок-контейнер */
        .container {
            margin: 40px auto;
            width: 90%;
            max-width: 1450px; 
            min-height: 1200px;
            background-color: white;
            padding: 35px;
            box-sizing: border-box;
            position: relative; /* Чтобы удобно двигать элементы внутри */
        }

        /* Верхняя панель с текстом приветствия и мишкой */
        .header-block {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .welcome-text {
            width: 100%;
            max-width: 450px; 
            text-align: left; 
            font-size: 20px; 
            color: black; 
            font-weight: bold; 
            transform: scaleY(2); 
            text-shadow: 1px 0.5px 0px #ffffff;
            line-height: 1.4;
			position: absolute;
			top: 26px;
			left: 2px;
        }
		.Drugani-text {
			/* Фиксируем ширину под слово и убираем невидимый хвост справа */
			width: 250px; 
			text-align: center;
    
			font-size: 44px; 
			color: black; 
			font-weight: bold; 
    
			/* Ровное центрирование без косяков с transform */
			position: absolute;
			top: 40px;
			left: 50%;
			margin-left: -125px; /* Сдвигаем назад ровно на половину ширины (250 / 2) */
    
			/* Твой фирменный стиль букв */
			transform: scaleY(2); 
			text-shadow: 1px 0.5px 0px #ffffff;
			line-height: 1;
			text-decoration: none; 
			transition: text-shadow 0.2s ease; 
		}

		/* Эффект при наведении курсора */
		.Drugani-text:hover {
			color: black; 
			/* Тень сдвигается на 2px вправо и 2px вниз, без размытия, цвет розовый */
			text-shadow: 2px 2px 0px #f200ff; 
		
		}
        .logo-bear {
            width: 100px; 
            height: 100px; 
			position: absolute;
			top: 0px;
			right: 0px;
        }

        /* Главная картинка с птицей */
        .main-img {
			display: block; 
			max-width: 670px; 
			width: 100%;
			height: auto; 
    
			position: absolute;
			top: 200px;         /* Ваша координата сверху */
			left: 50%;          /* Сдвигает левый край картинки ровно на центр экрана */
			transform: translateX(-50%);
			
        }
    </style>
</head>
<body>

    <h3 class="main-title">Порно.com коммерческие товары оптом</h3>
	
    <div class="container">

        <div class="header-block">

                Всем привет, это мой сайт, тут я буду писать о всём чем вздумаю, но самым главным контентом будут обзоры на музяку и всякие новости из жизни (они вам пиздец необходимы).
            </p>
            <img class="logo-bear" src="https://upload.wikimedia.org/wikipedia/en/thumb/6/65/RHbear.svg/250px-RHbear.svg.png" alt="Radiohead Bear">
        </div>
		
        <a href="friends.html" class="Drugani-text">
            ДРУГАНЫ
        </a>
		
        <!-- Картинка со злой синей птицей -->
        <img class="main-img" src="https://png.pngtree.com/thumb_back/fh260/background/20230610/pngtree-picture-of-a-blue-bird-on-a-black-background-image_2937385.jpg" alt="Blue Bird">
	
        <!-- Блок комментариев Giscus (уходит вниз под птицу, чтобы ничего не перекрывать) -->

    </div> <!-- Конец белого контейнера -->

</body>
</html>
